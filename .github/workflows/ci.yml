name: Core verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: windows-latest, python: "3.12"}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python }}', cache: pip}
      - run: python -m pip install -e ".[dev,mcp,browser]"
      - run: python scripts/check_manifest.py
      - run: python -m pytest -q -m "not browser and not live"
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - run: python scripts/build_plugin.py
      - uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.os }}-${{ matrix.python }}
          path: |
            dist/*.whl
            dist/litbridge-core-plugin.zip
          retention-days: 7
