[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "litbridge-localcatalog-example"
version = "0.1.0"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["litbridge>=0.2,<0.3"]
[project.entry-points."litbridge.providers"]
localcatalog = "litbridge_localcatalog:create_provider"
[tool.setuptools.packages.find]
where = ["src"]
