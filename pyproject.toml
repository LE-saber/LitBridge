[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "litbridge"
version = "0.2.1"
description = "Local-first literature workflow, document normalization and open provider protocol for AI agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<0.29", "pydantic>=2.8,<3", "beautifulsoup4>=4.12,<5", "defusedxml>=0.7,<1", "pypdf[crypto]>=5.9,<7"]

[project.optional-dependencies]
mcp = ["mcp>=1.28,<2"]
browser = ["playwright>=1.60,<2"]
structured = ["docling==2.132.0", "rapidocr==3.9.2", "onnxruntime>=1.30,<2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "reportlab>=4,<5"]

[project.scripts]
litbridge = "litbridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: opt-in public-network checks", "browser: actual local Chromium checks", "mcp: official SDK stdio integration"]
